services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://ledger:ledger@db:5432/payment_ledger
      - ADDRESS=0.0.0.0:3000
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=ledger
      - POSTGRES_PASSWORD=ledger
      - POSTGRES_DB=payment_ledger
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
